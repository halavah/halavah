name: Refresh current-year contributions

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-year-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned SVG generator
        run: npm ci --prefix .github/scripts --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Test calendar boundaries
        run: node --test .github/scripts/contribution-period.test.mjs
      - name: Generate current-year artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-contributions.mjs
      - name: Amend GitHub profile without adding commits
        run: |
          test "$(git rev-list --count HEAD)" = 1
          expected=$(git rev-parse HEAD)
          git add README.md assets/profile/contributions-static.svg assets/profile/contributions-static-dark.svg assets/profile/github-contribution-grid-snake.svg assets/profile/github-contribution-grid-snake-dark.svg assets/profile/contributions-state.json
          if ! git diff --cached --quiet; then
            git -c user.name=halavah -c user.email=55541070+halavah@users.noreply.github.com commit --amend --no-edit
            git push --force-with-lease="refs/heads/master:$expected" origin HEAD:master
          fi
